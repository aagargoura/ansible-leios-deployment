name: Auto-Update Leios Node Prototype

on:
  schedule:
    # Runs every Monday at 04:00 AM UTC to check for weekend prototype releases
    - cron: '0 4 * * 1'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Latest Leios Release Tag from IOG
        id: get_release
        run: |
          RAW_TAG=$(curl -s https://api.github.com/repos/input-output-hk/ouroboros-leios/releases/latest | jq -r .tag_name)

          # Fallback check if releases API returns null/empty
          if [ "$RAW_TAG" == "null" ] || [ -z "$RAW_TAG" ]; then
            FINAL_TAG="prototype-2026w31"
            echo "No valid release found. Defaulting to fallback tag: $FINAL_TAG"
          else
            FINAL_TAG="$RAW_TAG"
            echo "Latest IOG Leios release tag fetched: $FINAL_TAG"
          fi

          echo "latest_tag=$FINAL_TAG" >> $GITHUB_OUTPUT
          echo "Target IOG Leios release tag: $FINAL_TAG"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/leios_deploy_key
          chmod 600 ~/.ssh/leios_deploy_key

          cat > ~/.ssh/config <<EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.21.2
          ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible Update Playbook on VPS
        env:
          ANSIBLE_HOST_KEY_CHECKING: false
        run: |
          ansible-playbook \
            -i inventory.ini \
            deploy-leios.yml \
            --private-key ~/.ssh/leios_deploy_key \
            --extra-vars "ansible_host=${{ secrets.VPS_IP }} ansible_user=${{ secrets.VPS_USERNAME }} leios_version_tag=${{ steps.get_release.outputs.latest_tag }}"
