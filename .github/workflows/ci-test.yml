name: Ansible CI Tests

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-syntax:
    name: Run Linters and Syntax Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (Ansible & Linters)
        run: |
          sudo apt-get update && sudo apt-get install -y ansible
          python -m pip install --upgrade pip
          pip install ansible-lint yamllint
          ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: |
          # Creates a basic yamllint config on the fly to ignore some strict rules
          echo -e "---\nextends: default\nrules:\n  line-length: disable\n  document-start: disable" > .yamllint
          yamllint .

      - name: Run ansible-lint
        run: |
          # Ignores missing roles/collections if they aren't downloaded
          ansible-lint -q --offline deploy-leios.yml deploy-monitoring.yml install-docker.yml harden-node.yml

      - name: Ansible Syntax Check (Harden Node)
        run: ansible-playbook -i inventory.ini harden-node.yml --syntax-check

      - name: Ansible Syntax Check (Docker)
        run: ansible-playbook -i inventory.ini install-docker.yml --syntax-check

      - name: Ansible Syntax Check (Monitoring)
        run: ansible-playbook -i inventory.ini deploy-monitoring.yml --syntax-check

      - name: Ansible Syntax Check (Leios Node)
        run: ansible-playbook -i inventory.ini deploy-leios.yml --syntax-check
