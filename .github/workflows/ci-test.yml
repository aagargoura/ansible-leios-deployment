name: Ansible CI Tests

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-syntax:
    name: Run Linters and Syntax Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            ansible-core==2.21.2 \
            ansible-lint==26.6.0 \
            yamllint==1.38.0

          ansible-galaxy collection install -r requirements.yml

      - name: Verify Ansible environment
        run: |
          ansible --version
          ansible-galaxy collection list

      - name: Run yamllint
        run: |
          yamllint .

      - name: Run ansible-lint
        run: |
          ansible-lint \
            deploy-leios.yml \
            deploy-monitoring.yml \
            install-docker.yml \
            harden-node.yml

      - name: Syntax check harden-node
        run: |
          ansible-playbook \
            -i inventory.ini \
            harden-node.yml \
            --syntax-check

      - name: Syntax check install-docker
        run: |
          ansible-playbook \
            -i inventory.ini \
            install-docker.yml \
            --syntax-check

      - name: Syntax check deploy-monitoring
        run: |
          ansible-playbook \
            -i inventory.ini \
            deploy-monitoring.yml \
            --syntax-check

      - name: Syntax check deploy-leios
        run: |
          ansible-playbook \
            -i inventory.ini \
            deploy-leios.yml \
            --syntax-check
