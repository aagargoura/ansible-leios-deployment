---
- name: Hardening IONOS VPS for Leios Node
  hosts: nodes
  remote_user: root
  become: true
  # This automatically loads local vars if present, or falls back to empty strings
  vars_files:
    - ['vars.local.yml', 'vars.empty.yml']

  vars:
    # It checks if local_ssh_public_key is defined (from vars.local.yml),
    # otherwise it pulls from the environment variable (for GitHub Actions)
    public_ssh_key: "{{ local_ssh_public_key | default(lookup('env', 'SSH_PUBLIC_KEY')) }}"
    # Checks vars.local.yml first, then GitHub Actions env, and defaults to "3010" if both are empty
    leios_port: "{{ local_leios_port | default(lookup('env', 'LEIOS_PORT')) | default('3010', true) }}"

  tasks:
    - name: Create dedicated 'deployer' user with sudo rights
      ansible.builtin.user:
        name: deployer
        groups: sudo
        append: true
        shell: /bin/bash

    - name: Allow 'deployer' user passwordless sudo
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/deployer
        line: 'deployer ALL=(ALL) NOPASSWD:ALL'
        create: true
        validate: 'visudo -cf %s'
        mode: '0440'

    - name: Add public SSH key to 'deployer' user
      ansible.posix.authorized_key:
        user: deployer
        state: present
        key: "{{ public_ssh_key }}"

    - name: Install UFW and Fail2ban
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
        state: present
        update_cache: true

    - name: Set UFW default policies
      community.general.ufw:
        default: "{{ item.policy }}"
        direction: "{{ item.direction }}"
      loop:
        - { policy: 'deny', direction: 'incoming' }
        - { policy: 'allow', direction: 'outgoing' }

    - name: Allow SSH traffic
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow Leios P2P traffic
      community.general.ufw:
        rule: allow
        port: "{{ leios_port }}"
        proto: tcp

    - name: Enable UFW Firewall
      community.general.ufw:
        state: enabled

    - name: Configure Fail2ban for SSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        mode: '0644'
        content: |
          [DEFAULT]
          bantime = 3600
          findtime = 600
          maxretry = 3

          [sshd]
          enabled = true
          port = 22
          mode = aggressive
      notify: Restart Fail2ban

  handlers:
    - name: Restart Fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
