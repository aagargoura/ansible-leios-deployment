name: Deploy Leios Node via Ansible

"on":
  push:
    branches:
      - main
    # Only trigger the pipeline if the Ansible playbooks or this workflow file actually changes
    paths:
      - 'deploy-leios.yml'
      - 'deploy-monitoring.yml'
      - 'requirements.yml'
      - 'ansible.cfg'
      - '.github/workflows/ci-leios.yml'
  workflow_dispatch:  # Allows manual triggering from the GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/leios_deploy_key
          chmod 600 ~/.ssh/leios_deploy_key

          cat > ~/.ssh/config <<EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.21.2
          ansible-galaxy collection install -r requirements.yml

      - name: Verify Ansible environment
        run: |
          ansible --version
          ansible-galaxy collection list

      - name: Deploy Leios Node
        env:
          ANSIBLE_HOST_KEY_CHECKING: false
        run: |
          ansible-playbook \
            -i inventory.ini \
            deploy-leios.yml \
            --private-key ~/.ssh/leios_deploy_key \
            --extra-vars "ansible_host=${{ secrets.VPS_IP }} ansible_user=${{ secrets.VPS_USERNAME }}"

      - name: Deploy Monitoring Stack
        env:
          ANSIBLE_HOST_KEY_CHECKING: false
        run: |
          ansible-playbook \
            -i inventory.ini \
            deploy-monitoring.yml \
            --private-key ~/.ssh/leios_deploy_key \
            --extra-vars "ansible_host=${{ secrets.VPS_IP }} ansible_user=${{ secrets.VPS_USERNAME }}"
