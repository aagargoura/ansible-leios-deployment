---
- name: Install and Configure Docker Engine
  hosts: nodes
  become: true
  gather_facts: true

  tasks:
    - name: Install prerequisite packages for Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create directory for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: true

    - name: Get dpkg architecture
      ansible.builtin.command:
        cmd: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Add Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris:
          - https://download.docker.com/linux/ubuntu
        suites:
          - "{{ ansible_facts.distribution_release }}"
        components:
          - stable
        architectures:
          - "{{ dpkg_arch.stdout }}"
        signed_by: /etc/apt/keyrings/docker.asc

    - name: Update apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker Engine and Plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add deployer user to docker group
      ansible.builtin.user:
        name: deployer
        groups:
          - docker
        append: true

    - name: Reset SSH connection after docker group change
      ansible.builtin.meta: reset_connection

    - name: Download ufw-docker helper script
      ansible.builtin.get_url:
        url: https://github.com/chaifeng/ufw-docker/raw/master/ufw-docker
        dest: /usr/local/bin/ufw-docker
        mode: '0755'

    - name: Check ufw-docker integration status
      ansible.builtin.stat:
        path: /etc/ufw/after.rules.d/ufw-docker
      register: ufw_docker_rules

    - name: Apply ufw-docker iptables integration
      ansible.builtin.command: /usr/local/bin/ufw-docker install
      when: not ufw_docker_rules.stat.exists
      changed_when: true

    - name: Reload UFW to apply Docker integration
      community.general.ufw:
        state: reloaded
