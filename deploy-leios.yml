---
- name: Deploy and Update Ouroboros Leios Node
  hosts: nodes
  become: true
  vars:
    # Defaults to prototype tag if not passed via --extra-vars from GitHub Actions
    leios_version: "{{ leios_version_tag | default('prototype-2026w31') }}"
    working_dir: "/home/deployer/leios-testnet"
    docker_network: "leios-monitoring"

  tasks:
    - name: Ensure working and config directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: deployer
        group: deployer
        mode: '0755'
      loop:
        - "{{ working_dir }}"
        - "{{ working_dir }}/config"

    - name: Download latest Musashi pin-config script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/input-output-hk/ouroboros-leios/main/testnet/pin-config.sh
        dest: "{{ working_dir }}/pin-config.sh"
        owner: deployer
        group: deployer
        mode: '0755'

    - name: Execute pin-config script to update topology and genesis files
      ansible.builtin.command:
        cmd: bash pin-config.sh
        chdir: "{{ working_dir }}"
      become: true
      become_user: deployer
      register: pin_config_result
      changed_when: true

    - name: Patch Prometheus bind address to allow container metrics scraping
      ansible.builtin.replace:
        path: "{{ working_dir }}/config/config.json"
        regexp: 'PrometheusSimple suffix 127\.0\.0\.1 12798'
        replace: 'PrometheusSimple suffix 0.0.0.0 12798'
      become: true
      become_user: deployer

      # UNCOMMENT THIS TASK ONLY WHEN A CHAIN RESET IS ANNOUNCED:
      # - name: Wipe database and logs directory for chain reset
      #   ansible.builtin.file:
      #     path: "{{ item }}"
      #     state: absent
      #   loop:
      #     - "{{ working_dir }}/db"
      #     - "{{ working_dir }}/node.log"

    - name: Ensure python3-pip and dependencies are installed via apt
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-docker
        state: present
        update_cache: true
      become: true

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Pull target Leios Docker image pre-flight
      community.docker.docker_image:
        name: "ghcr.io/input-output-hk/ouroboros-leios/cardano-node-testnet:{{ leios_version }}"
        source: pull
        force_source: true

    - name: Run Leios Docker Container
      community.docker.docker_container:
        name: leios-relay
        image: "ghcr.io/input-output-hk/ouroboros-leios/cardano-node-testnet:{{ leios_version }}"
        state: started
        restart_policy: unless-stopped
        recreate: true
        ports:
          - "3010:3010"
        networks:
          - name: "{{ docker_network }}"
            aliases:
              - leios-relay
        volumes:
          - "{{ working_dir }}:/data"
          - "{{ working_dir }}/config:/app/config:ro"
      become: true

    - name: Wait for Leios container to reach running state
      community.docker.docker_container_info:
        name: leios-relay
      register: container_info
      until: container_info.container.State.Running == true
      retries: 6
      delay: 5

    - name: Verify node is synced and healthy via cardano-cli socket query
      ansible.builtin.command:
        cmd: docker exec leios-relay cardano-cli query tip --testnet-magic 164 --socket-path /data/node.socket
      register: cli_query
      until: cli_query.rc == 0
      retries: 15
      delay: 5
      changed_when: false
      become: true
