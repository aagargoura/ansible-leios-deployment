---
- name: Deploy Local Monitoring Stack (Prometheus & Grafana)
  hosts: nodes
  become: true
  vars:
    monitoring_dir: "/home/deployer/monitoring"
    docker_network: "leios-monitoring"
    grafana_admin_username: "{{ local_grafana_username | default(lookup('env', 'GRAFANA_USERNAME'), true) }}"
    grafana_admin_password: "{{ local_grafana_password | default(lookup('env', 'GRAFANA_PASSWORD'), true) }}"

  tasks:
    - name: Ensure monitoring directory exists
      ansible.builtin.file:
        path: "{{ monitoring_dir }}"
        state: directory
        owner: deployer
        group: deployer
        mode: '0755'

    - name: Copy Prometheus alert rules
      ansible.builtin.copy:
        src: alertmanager_rules.yml
        dest: "{{ monitoring_dir }}/alertmanager_rules.yml"
        owner: deployer
        group: deployer
        mode: '0644'
      notify: Reload Prometheus

    - name: Copy Prometheus configuration
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/prometheus.yml"
        owner: deployer
        group: deployer
        mode: '0644'
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          rule_files:
            - "/etc/prometheus/alertmanager_rules.yml"

          scrape_configs:
            - job_name: 'leios-relay'
              static_configs:
                - targets: ['leios-relay:12798']
      become: true
      become_user: deployer
      notify: Reload Prometheus

    - name: Verify Leios container exists before deploying monitoring
      community.docker.docker_container_info:
        name: leios-relay
      register: leios_container

    - name: Fail if Leios container is missing
      ansible.builtin.fail:
        msg: "Leios container must exist before deploying monitoring"
      when: not leios_container.exists

    - name: Copy Docker Compose configuration for monitoring
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        owner: deployer
        group: deployer
        mode: '0644'
        content: |
          services:
            prometheus:
              image: prom/prometheus:v3.13.2
              container_name: prometheus
              restart: unless-stopped
              networks:
                - "{{ docker_network }}"
              ports:
                - "127.0.0.1:9090:9090"
              volumes:
                - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
                - "./alertmanager_rules.yml:/etc/prometheus/alertmanager_rules.yml:ro"
                - "prometheus_data:/prometheus"
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'

            grafana:
              image: grafana/grafana:13.1.1
              container_name: grafana
              restart: unless-stopped
              ports:
                - "127.0.0.1:3000:3000"
              networks:
                - "{{ docker_network }}"
              volumes:
                - "grafana_data:/var/lib/grafana"
              environment:
                - GF_SECURITY_ADMIN_USER={{ grafana_admin_username }}
                - GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}

          volumes:
            prometheus_data:
            grafana_data:
          networks:
            "{{ docker_network }}":
              external: true
      become: true
      become_user: deployer

    - name: Deploy Prometheus and Grafana via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        state: present
      become: true
      become_user: deployer

  handlers:
    - name: Reload Prometheus
      community.docker.docker_container:
        name: prometheus
        state: restarted
        restart: true
      become: true
      become_user: deployer