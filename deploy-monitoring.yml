---
- name: Deploy Local Monitoring Stack (Prometheus & Grafana)
  hosts: nodes
  become: true
  vars:
    monitoring_dir: "/home/deployer/monitoring"
    grafana_admin_username: "{{ local_grafana_username | default(lookup('env', 'GRAFANA_USERNAME'), true) }}"
    grafana_admin_password: "{{ local_grafana_password | default(lookup('env', 'GRAFANA_PASSWORD'), true) }}"

  tasks:
    - name: Ensure monitoring directory exists
      ansible.builtin.file:
        path: "{{ monitoring_dir }}"
        state: directory
        owner: deployer
        group: deployer
        mode: '0755'

    - name: Copy Prometheus configuration
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/prometheus.yml"
        owner: deployer
        group: deployer
        mode: '0644'
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: 'leios-relay'
              static_configs:
                - targets: ['host.docker.internal:12798']
      become: true
      become_user: deployer

    - name: Copy Docker Compose configuration for monitoring
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        owner: deployer
        group: deployer
        mode: '0644'
        content: |
          services:
            prometheus:
              image: prom/prometheus:v3.13.2
              container_name: prometheus
              restart: unless-stopped
              extra_hosts:
                - "host.docker.internal:host-gateway"
              ports:
                - "127.0.0.1:9090:9090"
              volumes:
                - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
                - "prometheus_data:/prometheus"
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'

            grafana:
              image: grafana/grafana:13.1.1
              container_name: grafana
              restart: unless-stopped
              ports:
                - "127.0.0.1:3000:3000"
              volumes:
                - "grafana_data:/var/lib/grafana"
              environment:
                - GF_SECURITY_ADMIN_USER={{ grafana_admin_username }}
                - GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}

          volumes:
            prometheus_data:
            grafana_data:
      become: true
      become_user: deployer

    - name: Deploy Prometheus and Grafana via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        state: present
      become: true
      become_user: deployer
