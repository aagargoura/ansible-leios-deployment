name: Auto-Update Leios Node Prototype

"on":
  schedule:
    # Runs every Monday at 04:00 AM UTC to check for weekend prototype releases
    - cron: '0 4 * * 1'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Latest Leios Release and Verify GHCR Docker Image
        id: get_release
        run: |
          # 1. Fetch latest release tag from GitHub Releases API (including pre-releases)
          GITHUB_TAG=$(curl -s https://api.github.com/repos/input-output-hk/ouroboros-leios/releases | jq -r '.[0].tag_name // empty')

          if [ -z "$GITHUB_TAG" ] || [ "$GITHUB_TAG" == "null" ]; then
            echo "No GitHub release found. Skipping deployment."
            echo "has_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found GitHub release tag: $GITHUB_TAG"

          # 2. Get anonymous bearer token for GHCR
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:input-output-hk/ouroboros-leios/cardano-node-testnet:pull" | jq -r .token)

          # 3. Fetch list of published Docker tags from GHCR
          GHCR_TAGS=$(curl -s -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/input-output-hk/ouroboros-leios/cardano-node-testnet/tags/list" | jq -r '.tags[]?')

          # 4. Check if the exact release tag (or sanitized tag) exists on GHCR
          if echo "$GHCR_TAGS" | grep -q "^${GITHUB_TAG}$"; then
            TARGET_TAG="$GITHUB_TAG"
          else
            # Try matching stripped hotfix version (e.g. prototype-2026w31a -> prototype-2026w31)
            CLEAN_TAG=$(echo "$GITHUB_TAG" | sed -E 's/([0-9]{4}w[0-9]{2})[a-z]+$/\1/')
            if echo "$GHCR_TAGS" | grep -q "^${CLEAN_TAG}$"; then
              TARGET_TAG="$CLEAN_TAG"
            else
              TARGET_TAG=""
            fi
          fi

          # 5. Handle output state
          if [ -n "$TARGET_TAG" ]; then
            echo "latest_tag=$TARGET_TAG" >> $GITHUB_OUTPUT
            echo "has_release=true" >> $GITHUB_OUTPUT
            echo "Matching Docker image found on GHCR: $TARGET_TAG"
          else
            echo "⚠️ Release '$GITHUB_TAG' was found on GitHub, but no matching Docker image exists on GHCR yet. Skipping deployment."
            echo "has_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.get_release.outputs.has_release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure SSH
        if: steps.get_release.outputs.has_release == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/leios_deploy_key
          chmod 600 ~/.ssh/leios_deploy_key

          cat > ~/.ssh/config <<EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Install Ansible dependencies
        if: steps.get_release.outputs.has_release == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.21.2
          ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible Update Playbook on VPS
        if: steps.get_release.outputs.has_release == 'true'
        run: |
          ansible-playbook \
            -i inventory.ini \
            deploy-leios.yml \
            --private-key ~/.ssh/leios_deploy_key \
            --extra-vars "ansible_host=${{ secrets.VPS_IP }} ansible_user=${{ secrets.VPS_USERNAME }} leios_version_tag=${{ steps.get_release.outputs.latest_tag }}"
